<!doctype html>
<html lang="ko">
<head>
<meta name="version" content="2026-11-10b">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감속기 선정툴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 상단 바 / 5단계 스테퍼 / 단계별 카드 1장 / 하단 이전·다음 */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --line: #e1e6ef;
  --fg: #161b26;
  --muted: #6b7486;
  --accent: #4a5af0;
  --accent-fg: #ffffff;
  --accent-soft: #eef0fe;
  --accent-line: #c9cffb;
  --ok: #17803d;
  --ok-soft: #e4f5ea;
  --warn: #9a5b00;
  --warn-soft: #fdf2dd;
  --danger: #c0352b;
  --danger-soft: #fdeceb;
  --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, Consolas, "D2Coding", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131b; --surface: #171d28; --surface-2: #1d2532; --line: #2c3646; --fg: #e7ebf2; --muted: #9aa5b8;
    --accent: #7d89ff; --accent-fg: #0d1022; --accent-soft: #232a4d; --accent-line: #3a4380;
    --ok: #5fd08a; --ok-soft: #173622; --warn: #e8ad53; --warn-soft: #3a2b12; --danger: #f2877d; --danger-soft: #41201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131b; --surface: #171d28; --surface-2: #1d2532; --line: #2c3646; --fg: #e7ebf2; --muted: #9aa5b8;
  --accent: #7d89ff; --accent-fg: #0d1022; --accent-soft: #232a4d; --accent-line: #3a4380;
  --ok: #5fd08a; --ok-soft: #173622; --warn: #e8ad53; --warn-soft: #3a2b12; --danger: #f2877d; --danger-soft: #41201d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.55 var(--font); }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 상단 */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 14px; }
.logo { width: 34px; height: 34px; color: var(--accent); flex: none; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
@media (max-width: 600px) { .conn { display: none; } .brand p { display: none; } }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.corp { display: flex; align-items: center; gap: 12px; margin-right: 8px; }   /* 왼쪽 '기어 + 감속기 선정툴' 과 같은 배치 */
.corp img { width: auto; height: 45px; object-fit: contain; display: block; flex: none; }
.corp-text { display: grid; justify-items: start; }
/* 회사명·이메일 줄을 왼쪽 '감속기 선정툴'·'Gearbox Configuration Tool' 줄과 같은 높이·기준선에 맞춤 */
.corp-text b { display: block; font-size: 14px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; line-height: 31px; }
.corp-text b::before { content: ""; display: inline-block; width: 0; font-size: 20px; }
.corp a { display: block; font-size: 12px; line-height: 1.55; color: var(--muted); text-decoration: none; white-space: nowrap; }
.corp a:hover { color: var(--accent); text-decoration: underline; }
.top .right .btn { white-space: nowrap; flex-shrink: 0; }
@media (max-width: 600px) { .top .wrap { flex-wrap: wrap; row-gap: 8px; } .top .right { flex-wrap: wrap; justify-content: flex-end; } .corp { margin-right: 0; gap: 6px; } .corp-text b { font-size: 13px; } .corp a { font-size: 10px; } .corp a span { display: none; } }
.conn { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.conn.on::before { background: var(--ok); }

/* 스테퍼 */
.stepper { background: var(--surface); border-bottom: 1px solid var(--line); }
.stepper ol { list-style: none; margin: 0 auto; padding: 22px 0 18px; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 820px; }
.stepper li { position: relative; display: grid; justify-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.stepper li::before { content: ""; position: absolute; top: 19px; left: calc(-50% + 30px); right: calc(50% + 30px); height: 2px; background: var(--line); }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.cur::before { background: var(--accent); }
.stepper .dot { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-2); border: 2px solid var(--line); color: var(--muted); }
.stepper li.cur { color: var(--accent); font-weight: 700; }
.stepper li.cur .dot { border-color: var(--accent); color: var(--accent); background: var(--surface); box-shadow: 0 0 0 4px var(--accent-soft); }
.stepper li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.stepper li.done { color: var(--fg); cursor: pointer; }
@media (max-width: 560px) { .stepper li span.lbl { font-size: 11px; } .stepper .dot { width: 32px; height: 32px; } .stepper li::before { top: 15px; } }

main { padding-block: 28px 48px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: 0 1px 3px rgba(20, 30, 60, .05); display: grid; gap: 20px; }
.card-head { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.card-head h2 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
.card-head p { margin: 4px 0 0; color: var(--muted); }
.card-head .aside { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 14px; min-height: 36px; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; color: var(--fg); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.lg { min-height: 46px; padding: 10px 26px; font-size: 15px; border-radius: 10px; }
.btn.link { border: 0; background: none; color: var(--muted); padding: 4px; min-height: 0; font-weight: 500; }
.btn.link:hover { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn svg { width: 15px; height: 15px; }

.panel { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
.form-row { display: grid; grid-template-columns: minmax(150px, 1fr) minmax(150px, 1fr) minmax(220px, 2.2fr) auto; gap: 14px; align-items: end; }
@media (max-width: 760px) { .form-row { grid-template-columns: 1fr 1fr; } .form-row .grow { grid-column: 1 / -1; } .form-row .act { grid-column: 1 / -1; } }
label.f { display: grid; gap: 6px; min-width: 0; align-content: start; }
label.f > span { font-size: 13px; color: var(--muted); font-weight: 600; }
label.f .hint { font-size: 12px; color: var(--muted); font-weight: 400; }
input[type=text], input[type=number], input[type=url], select {
  width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface);
}
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:disabled, select:disabled { background: var(--surface-2); color: var(--muted); }

/* 선택된 모터 */
.picked { border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 12px; padding: 20px 22px; display: grid; gap: 14px; }
.picked .t { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; }
.picked .t svg { width: 20px; height: 20px; }
.picked .path { font-size: 12px; color: var(--accent); }
.picked .name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; margin-top: 2px; }
.picked .head { display: flex; align-items: flex-start; gap: 12px; }
.picked .head .btn { margin-left: auto; }
.kv { display: flex; flex-wrap: wrap; gap: 8px 40px; }
.kv div { display: grid; gap: 2px; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.empty-pick { border: 1px dashed var(--line); border-radius: 12px; padding: 26px; text-align: center; color: var(--muted); }

/* 사양표 */
.spec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; }
.spec { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.spec h3 { margin: 0; font-size: 13px; font-weight: 700; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.spec table { width: 100%; border-collapse: collapse; }
.spec th, .spec td { padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 13px; text-align: left; }
.spec tr:last-child th, .spec tr:last-child td { border-bottom: 0; }
.spec th { color: var(--muted); font-weight: 500; width: 46%; }
.spec td { font-weight: 600; font-variant-numeric: tabular-nums; }
.spec td small { color: var(--muted); font-weight: 400; margin-left: 4px; }

.callout { border-radius: 10px; padding: 12px 16px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.callout.ok { background: var(--ok-soft); color: var(--ok); }
.callout.warn { background: var(--warn-soft); color: var(--warn); }
.callout.bad { background: var(--danger-soft); color: var(--danger); }
.callout.info { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.callout b { color: inherit; }

/* 조건 */
.choice { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 12px; }
.choice label { border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; background: var(--surface); }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice b { font-size: 15px; }
.choice span { font-size: 12px; color: var(--muted); }
.cond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 16px; align-items: start; }
.section-title { font-size: 14px; font-weight: 700; margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.1); }

/* 결과 표 */
.res-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.res-bar .count { color: var(--muted); font-size: 13px; }
.res-bar .spacer { flex: 1; }
.tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 62vh; }
table.res { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.res th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; line-height: 1.25; }
table.res th small { display: block; font-weight: 500; font-size: 10.5px; }
table.res td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.res tbody tr { cursor: pointer; }
table.res tbody tr:hover td { background: var(--surface-2); }
table.res tbody tr.sel td { background: var(--accent-soft); }
table.res tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.res td.code { font-family: var(--mono); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--danger-soft); color: var(--danger); }
.pill.caution { background: transparent; color: var(--warn); border: 1px solid currentColor; padding: 1px 8px; }
.bar { display: inline-grid; grid-template-columns: 54px auto; gap: 6px; align-items: center; }
.bar i { display: block; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.bar i b { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 3px; }
.bar i b.warn { background: var(--warn); } .bar i b.bad { background: var(--danger); }

/* 최종 */
.drawing-body { padding: 14px 16px; display: grid; gap: 12px; }
.dk { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.dk span { color: var(--muted); }
.dk code { font-family: var(--mono); font-size: 14px; font-weight: 700; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; }
.dfiles { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
.dfile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.dfile .dname { display: grid; flex: 1 1 180px; min-width: 0; }
.dfile .dname b { color: var(--fg); font-size: 13px; }
.dfile .dname small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.dfile a.btn { text-decoration: none; white-space: nowrap; }
@media (max-width: 600px) { .dfile .dname { flex-basis: 100%; } .dfile a.btn { flex: 1 1 0; justify-content: center; } }
.muted { margin: 0; color: var(--muted); font-size: 13px; }
.final { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px; align-items: start; }
.combo { border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 12px; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.combo .part { display: grid; }
.combo .part small { font-size: 11px; color: var(--muted); }
.combo .part b { font-size: 17px; }
.combo .plus { color: var(--accent); font-weight: 800; font-size: 18px; }
.combo .verdict { margin-left: auto; flex: 1 1 300px; max-width: 520px; padding: 10px 14px; }
@media (max-width: 760px) { .combo .verdict { margin-left: 0; max-width: none; width: 100%; } }

.nav { display: flex; gap: 10px; margin-top: 20px; }
.nav .spacer { flex: 1; }

/* 연결 설정 */
.setup { max-width: 560px; margin: 0 auto; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: min(560px, calc(100vw - 32px)); z-index: 50; }
#toast.err { background: var(--danger); color: #fff; }
.loading { padding: 50px 0; text-align: center; color: var(--muted); }

/* 감속기 종류 안내 팝업 */
.modal { position: fixed; inset: 0; z-index: 60; background: rgba(12, 18, 30, .55); display: grid; place-items: center; overflow: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-box { background: var(--surface); border-radius: 14px; width: min(640px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); min-height: 0; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 17px; flex: 1; }
.pdfv .modal-box { width: min(1000px, 100%); height: calc(100dvh - 32px); }
.pdfv .modal-head { flex-wrap: wrap; padding: 10px 14px; }
.pdfv .modal-head h3 { font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdfv .modal-head a.btn { text-decoration: none; }
.pdf-tools { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pdf-tools .btn { min-width: 36px; padding: 6px 10px; }
.pdfv .modal-body { background: var(--surface-2); padding: 12px; gap: 12px; justify-items: center; overflow: auto; }
.pdfv canvas { display: block; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); max-width: none; }
.pdfv .pdf-msg { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
@media (max-width: 600px) { .modal.pdfv { padding: 0; place-items: stretch; } .pdfv .modal-box { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; } .pdfv .modal-head h3 { flex-basis: 100%; } .pdfv .modal-head { gap: 6px; } .pdfv .modal-head .btn { padding: 6px 10px; } }
.modal-body { overflow-y: auto; overscroll-behavior: contain; min-height: 0; flex: 1 1 auto; padding: 18px 20px 22px; display: grid; gap: 18px; align-content: start; }
.photo-group h4 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, 100px); gap: 12px; justify-content: center; }
.photo-grid figure { margin: 0; width: 100px; display: grid; gap: 4px; }
.photo-grid img { width: 100px; height: 100px; object-fit: contain; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; display: block; }
.photo-grid figcaption { font-size: 12px; text-align: center; color: var(--fg); word-break: break-all; }
.photo-empty { color: var(--muted); text-align: center; padding: 30px 0; }
.photo-grid .desc { display: block; min-height: 2.6em; font-size: 11px; line-height: 1.3; color: var(--muted); text-align: center; word-break: keep-all; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.photo-pick:hover .desc, .photo-pick.on .desc { color: var(--fg); }
.photo-tip { margin: 0 0 12px; font-size: 12px; color: var(--muted); text-align: center; }
.photo-pick { all: unset; box-sizing: border-box; width: 100px; display: grid; gap: 4px; cursor: pointer; border-radius: 10px; }
.photo-pick:hover img, .photo-pick:focus-visible img { border-color: var(--accent, #4f5bd5); box-shadow: 0 0 0 2px var(--accent, #4f5bd5); }
.photo-pick:focus-visible { outline: 2px solid var(--accent, #4f5bd5); outline-offset: 2px; }
.photo-pick.on img { border-color: var(--accent, #4f5bd5); box-shadow: 0 0 0 3px var(--accent, #4f5bd5); }
.photo-pick .cap { font-size: 12px; text-align: center; color: var(--fg); word-break: break-all; }
.photo-pick.on .cap { font-weight: 700; }
.photo-off { opacity: .45; cursor: not-allowed; }
.photo-none { cursor: default; }
.photo-off small { display: block; font-size: 10px; color: var(--muted); }
@media print {
  .top .right > :not(.corp), .stepper, .nav, .no-print { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; border: 0; padding: 0; }
  @page { size: A4; margin: 10mm; }
  .dfile a.btn { display: none !important; }            /* 보기·다운로드 버튼은 종이에서 의미 없음 */
  .dfile { padding: 4px 8px; }
  .card-head { margin-bottom: 8px; }
  .combo { padding: 10px 14px; }
  .drawing-body { padding: 8px 12px; gap: 6px; }
  .final { gap: 10px; }
  .spec table td, .spec table th { padding-top: 4px !important; padding-bottom: 4px !important; }
  .spec, .combo, .final > * { break-inside: avoid; }
}
</style>
</head>
<body>

<script src="config.js"></script>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let toastTimer;
function toast(msg, err = false) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, err ? 7000 : 2600);
}
const N = v => (v == null || v === '' ? null : Number(v));
const fmt = (v, d = 2) => {
  if (v == null || Number.isNaN(v)) return '–';
  const n = Number(v);
  return n.toLocaleString('ko-KR', { maximumFractionDigits: Math.abs(n) >= 100 ? 0 : d });
};
const ratioNum = code => { const m = String(code ?? '').match(/\d+(?:\.\d+)?/); return m ? +m[0] : null; };   // 104.43K → 104.43
const cmpNat = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'ko', { numeric: true });
function errText(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Supabase에 접속하지 못했습니다. Project URL과 인터넷 연결을 확인하세요.';
  if (/Invalid API key|No API key/i.test(m)) return 'API 키가 올바르지 않습니다. 연결 설정에서 anon / publishable 키를 확인하세요.';
  if (/permission denied|42501/i.test(m)) return '조회 권한이 없습니다. supabase_policies.sql 을 실행했는지 확인하세요.';
  if (/does not exist|PGRST205|Could not find the table/i.test(m)) return '테이블을 찾지 못했습니다. 데이터 SQL 스크립트를 실행했는지 확인하세요.';
  return m;
}

/* ---------- 연결 ---------- */
const CFG_URL = 'mgdb.url', CFG_KEY = 'mgdb.key';
const CATALOG = { bucket: 'catalogue', planetary: 'planetary.pdf', hollow: 'hollow.pdf' };
const DRAWING = { bucket: 'download', exts: { pdf: 'PDF 도면', step: 'STEP 3D', stp: 'STEP 3D' } };
let sb = null;
async function fetchAll(table, select = '*', order) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let q = sb.from(table).select(select).range(from, from + 999);
    if (order) q = q.order(order, { ascending: true });
    const { data, error } = await q;
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}

/* ---------- 데이터 ---------- */
const up = v => String(v ?? '').trim().toUpperCase();
const DB = { seriesDesc: new Map(), photoMeta: new Map(), motors: [], planetary: [], hollow: [], slotsBySize: new Map(), ifaceById: new Map(), bushings: [], bushingLoaded: false, holes: new Map(), holeLoaded: false };
async function loadAll() {
  const [motors, btypes, mseries, mfrs, plan, hol, models, ifaces, links] = await Promise.all([
    fetchAll('motor', '*', 'motor_id'), fetchAll('motor_basic_type'), fetchAll('motor_series'), fetchAll('manufacturer'),
    fetchAll('planetary_gearbox', '*', 'gearbox_id'), fetchAll('hollow_gearbox', '*', 'gearbox_id'),
    fetchAll('model'), fetchAll('interface'), fetchAll('model_interface'),
  ]);
  const mById = new Map(mfrs.map(x => [x.manufacturer_id, x])), sById = new Map(mseries.map(x => [x.series_id, x])), bById = new Map(btypes.map(x => [x.basic_type_id, x]));
  DB.motors = motors.map(m => {
    const b = bById.get(m.basic_type_id), s = b && sById.get(b.series_id), f = s && mById.get(s.manufacturer_id);
    return { ...m, basic_type: b?.basic_type_name ?? '', series: s?.series_name ?? '', manufacturer: f?.name ?? '' };
  }).sort((a, b) => cmpNat(a.manufacturer, b.manufacturer) || cmpNat(a.series, b.series) || cmpNat(a.motor_code, b.motor_code));
  DB.planetary = plan; DB.hollow = hol;
  // 부싱 표 (없으면 부싱 없이 직결만 판정)
  // 입력 홀: basic_dimension 테이블을 먼저, 없으면 input_hole 테이블 (컬럼 이름은 자동 인식). 둘 다 없으면 어댑터 축경으로 판단
  DB.holes = new Map(); DB.holeLoaded = false; DB.holeSource = '';
  for (const table of ['basic_dimension', 'input_hole']) {
    try {
      const rows = await fetchAll(table);
      const cols = rows.length ? Object.keys(rows[0]) : [];
      const sCol = pickCol(cols, ['series_code', 'series']);
      const zCol = pickCol(cols, ['size']);
      const hCol = pickCol(cols, ['basic_hole', 'input_hole', 'input_hole_dia', 'hole', 'input_g', 'gearbox_input_dia', 'input_dia']);
      if (!sCol || !zCol || !hCol) { console.warn(`${table}: 시리즈/사이즈/입력 홀 컬럼을 찾지 못함`, cols); continue; }
      for (const r of rows) if (r[sCol] != null && N(r[hCol]) != null) DB.holes.set(holeKey(r[sCol], r[zCol]), N(r[hCol]));
      DB.holeLoaded = true; DB.holeSource = table;
      break;
    } catch { /* 테이블 없음 → 다음 후보 */ }
  }
  // 시리즈 설명 (사진 팝업에 표시). 테이블이 없거나 못 읽어도 나머지는 그대로 동작
  // 시리즈 설명·사진 정보 (사진 팝업에 표시). 테이블이 없거나 못 읽어도 나머지는 그대로 동작
  //  사진 정보: series 테이블에 photo_filename 컬럼(사진 1장 = 1행)이 있으면 그것을 쓰고, 없으면 series_photo 테이블을 씀
  //  순서 컬럼: sort_order / order / sort / seq 중 있는 것
  let seriesRows = [];
  try { seriesRows = await fetchAll('series'); } catch {}
  DB.seriesDesc = new Map(seriesRows.filter(r => r.series_code && r.description && (r.photo_filename == null || up(r.photo_filename) === up(r.series_code)))
    .map(r => [up(r.series_code), String(r.description).trim()]));
  let photoRows = seriesRows.filter(r => r.photo_filename);
  if (!photoRows.length) { try { photoRows = await fetchAll('series_photo'); } catch {} }
  const orderOf = (r, i) => { for (const k of ['sort_order', 'order', 'sort', 'seq']) { const v = parseFloat(r[k]); if (Number.isFinite(v)) return v; } return 1e6 + i; };
  DB.photoMeta = new Map(photoRows.filter(r => r.series_code && r.photo_filename).map((r, i) => [up(String(r.photo_filename).replace(/\.[^.]+$/, '')), {
    series: up(r.series_code), title: String(r.photo_title ?? '').trim(), desc: String(r.description ?? '').trim(), order: orderOf(r, i), idx: i }]));
  for (const r of seriesRows) if (r.series_code && r.description && !DB.seriesDesc.has(up(r.series_code))) DB.seriesDesc.set(up(r.series_code), String(r.description).trim());
  try { DB.bushings = await fetchAll('bushing', '*', 'bushing_code'); DB.bushingLoaded = true; }
  catch { DB.bushings = []; DB.bushingLoaded = false; }
  DB.ifaceById = new Map(ifaces.map(i => [i.interface_id, i]));
  const modelById = new Map(models.map(m => [m.model_id, m]));
  DB.slotsBySize = new Map();   // "GPB|060" -> [{type, slot, iface}]
  for (const l of links) {
    const m = modelById.get(l.model_id); if (!m) continue;
    const k = m.series_code + '|' + m.size;
    if (!DB.slotsBySize.has(k)) DB.slotsBySize.set(k, []);
    DB.slotsBySize.get(k).push({ type: l.motor_type, slot: l.slot_no, iface: DB.ifaceById.get(l.interface_id) });
  }
}

/* 모터와 맞는 어댑터: 파일롯경·PCD·체결나사는 같아야 하고,
   축경은 같으면 직결, 다르면 부싱(모터 축경 S → 감속기 입력경 G)으로 맞춤. 직결을 먼저 고름 */
const same = (a, b) => a != null && b != null && Math.abs(Number(a) - Number(b)) < 1e-6;
const pickCol = (cols, names) => cols.find(c => names.includes(String(c).toLowerCase())) || null;
const normSize = z => { const t = String(z ?? '').trim().toUpperCase(); return /^\d+$/.test(t) ? String(Number(t)) : t; };   // '042' = '42'
const holeKey = (series, size) => String(series ?? '').trim().toUpperCase() + '|' + normSize(size);
// 부싱: 모터 축경 → 감속기 입력경. 부싱 표에 시리즈·사이즈 컬럼이 있으면 그것까지 맞는 부싱을 먼저 고름
function bushingFor(motorShaft, inputDia, series, size) {
  const hits = DB.bushings.filter(bu => same(bu.motor_shaft_dia, motorShaft) && same(bu.gearbox_input_dia, inputDia));
  if (!hits.length) return null;
  const sCol = pickCol(Object.keys(hits[0]), ['series_code', 'series']), zCol = pickCol(Object.keys(hits[0]), ['size']);
  if (series != null && (sCol || zCol)) {
    const fits = bu => (!sCol || bu[sCol] == null || bu[sCol] === '' || String(bu[sCol]).toUpperCase() === String(series).toUpperCase())
                    && (!zCol || bu[zCol] == null || bu[zCol] === '' || normSize(bu[zCol]) === normSize(size));
    const exact = hits.find(bu => fits(bu) && (!sCol || bu[sCol]) && (!zCol || bu[zCol]));
    return exact || hits.find(fits) || null;
  }
  return hits[0];
}
// 모터 종류로 어댑터 슬롯 종류 결정: 스테핑(스텝) 모터 → ST, 그 외(서보) → SV
// PCD 비교: 스테핑 모터는 사각 볼트 간격(예: 47.14)과 대각선 PCD(47.14×√2 = 66.67)가 섞여 쓰이므로,
//  어댑터·모터 어느 쪽이 사각 간격이든 대각선이든 같은 것으로 봄
const pcdMatch = (ifacePcd, motor) => same(ifacePcd, motor.pcd)
  || (slotTypeOf(motor) === 'ST' && motor.pcd != null && ifacePcd != null
      && (Math.abs(Number(ifacePcd) - Number(motor.pcd) * Math.SQRT2) < 0.15
       || Math.abs(Number(ifacePcd) * Math.SQRT2 - Number(motor.pcd)) < 0.15));
const slotTypeOf = motor => /step|스테핑|스텝/i.test(String(motor.motor_type || '')) ? 'ST' : 'SV';
function adapterFor(motor, series, size) {
  const st = slotTypeOf(motor);
  const slots = (DB.slotsBySize.get(series + '|' + size) || []).filter(s => s.type === st && s.iface
    && same(s.iface.pilot_dia, motor.centering) && pcdMatch(s.iface.pcd, motor)
    && String(s.iface.tap_size).toUpperCase() === String(motor.mounting_thread || '').toUpperCase())
    .sort((a, b) => a.slot - b.slot);
  const direct = slots.find(s => same(s.iface.shaft_dia, motor.diameter));
  if (direct) return { ...direct, bushing: null };
  for (const s of slots) {
    const bu = Number(s.iface.shaft_dia) > Number(motor.diameter) ? bushingFor(motor.diameter, s.iface.shaft_dia, series, size) : null;
    if (bu) return { ...s, bushing: bu };
  }
  return null;
}
function candidates(motor, kind) {
  const list = [];
  const add = (g, k, flangeSize) => {
    // 어댑터는 4→5단계로 넘어갈 때 확인. 여기서는 모든 감속기를 넣고 어댑터 정보만 붙임 (없으면 null)
    const ad = adapterFor(motor, g.series_code, flangeSize);
    const fit = shaftFit(motor, g.series_code, flangeSize, g.size);
    // 입력 홀·어댑터플랜지 정보가 아직 하나도 등록되지 않은 사이즈 (예: 새로 추가한 GBX) → 맞는지 알 수 없음
    const unknown = !fit && !ad && !hasIfaceData(g.series_code, flangeSize, g.size);
    list.push({ g, kind: k, adapter: ad, fit, unknown, ratio: ratioNum(g.ratio_code), sizeLabel: k === 'hollow' ? flangeSize : g.size });
  };
  if (kind !== 'hollow') for (const g of DB.planetary) add(g, 'planetary', g.size);
  if (kind !== 'planetary') for (const g of DB.hollow) add(g, 'hollow', g.flange_size);
  return list;
}

const withAdapter = list => list.filter(c => c.adapter);
// 이 시리즈·사이즈에 입력 홀이나 어댑터플랜지(ST/SV) 정보가 하나라도 있는지
const hasIfaceData = (series, size, baseSize) =>
  (DB.holeLoaded && DB.holes.get(holeKey(series, baseSize)) != null) || (DB.slotsBySize.get(series + '|' + size) || []).some(s => s.iface);
// 조합에 쓰는 부싱: 입력 홀 표가 있으면 입력 홀 기준, 없으면 어댑터 축경 기준
const comboBushing = r => (DB.holeLoaded && r.fit) ? r.fit.bushing : (r.adapter ? r.adapter.bushing : r.fit?.bushing ?? null);
/* 축경만 보고 사이즈가 맞는지: SV 어댑터 축경 = 모터 축경(직결) 또는 부싱으로 맞춤. 파일롯경·PCD·나사는 4→5에서 확인 */
function shaftFit(motor, series, size, baseSize) {
  // 1순위: 입력 홀 표 (시리즈·사이즈별 입력 홀 지름). 같으면 직결, 다르면 부싱 G{입력홀}S{모터축경}
  // 3순위: 모터 축경과 같은 축경의 어댑터(ST/SV)가 있으면 어댑터로 직결 (예: 스테핑 6.35축 어댑터)
  const adapterDirect = () => (DB.slotsBySize.get(series + '|' + size) || [])
    .some(s => s.type === slotTypeOf(motor) && s.iface && same(s.iface.shaft_dia, motor.diameter));
  if (DB.holeLoaded) {
    const hole = DB.holes.get(holeKey(series, baseSize));
    if (hole != null) {
      if (same(hole, motor.diameter)) return { label: '직결', bushing: null, hole };
      if (Number(hole) > Number(motor.diameter)) {            // 입력 홀이 모터 축경보다 클 때만 부싱
        const bu = bushingFor(motor.diameter, hole, series, baseSize);
        if (bu) return { label: `부싱 ${bu.bushing_code}`, bushing: bu, hole };
      }
    }
    return adapterDirect() ? { label: '어댑터 직결', bushing: null, hole } : null;
  }
  // 입력 홀 표가 없을 때: 어댑터(ST/SV) 축경으로 판단
  const slots = (DB.slotsBySize.get(series + '|' + size) || []).filter(s => s.type === slotTypeOf(motor) && s.iface);
  if (slots.some(s => same(s.iface.shaft_dia, motor.diameter))) return { label: '직결', bushing: null, hole: null };
  for (const s of slots.sort((a, b) => a.slot - b.slot)) {
    const bu = Number(s.iface.shaft_dia) > Number(motor.diameter) ? bushingFor(motor.diameter, s.iface.shaft_dia, series, baseSize) : null;
    if (bu) return { label: `부싱 ${bu.bushing_code}`, bushing: bu, hole: null };
  }
  return null;
}

/* ---------- 상태 ---------- */
const S = {
  step: 1,
  f: { brand: '', type: '', model: '' },
  motor: null,
  cond: { kind: 'planetary', ratioMode: 'spec', spec: { series: '', size: '', ratio: '', rep: '', pos: '' }, grade: 'P2', ratios: [], sf: 1.5, loadTorque: '', useEff: true },
  onlyOk: true, onlyAdapter: false, sort: 'margin', pick: null,
};
const KIND = { planetary: '유성감속기', hollow: '할로우로터리', all: '전체' };

/* ---------- 계산 ---------- */
function evaluate(c) {
  const m = S.motor, g = c.g, cond = S.cond;
  const eff = cond.useEff && N(g.efficiency) ? N(g.efficiency) : 1;
  const t2 = N(m.nominal_torque) != null && c.ratio ? N(m.nominal_torque) * c.ratio * eff : null;           // 출력 토크
  const t2peak = N(m.peak_torque) != null && c.ratio ? N(m.peak_torque) * c.ratio * eff : null;
  const need = t2 != null ? t2 * (Number(cond.sf) || 1) : null;                                               // 필요 정격토크
  const rated = N(g.rated_torque);
  const margin = rated && need ? rated / need : null;                                                          // 여유율
  const n2 = N(m.nominal_speed) && c.ratio ? N(m.nominal_speed) / c.ratio : null;
  const issues = [];
  let level = 'ok';
  if (margin == null) { level = 'warn'; issues.push('정격토크 정보 없음'); }
  else if (margin < 1) { level = 'bad'; issues.push('토크 부족'); }
  // 속도는 판정에서 제외하고 주의 메시지만 남김
  const cautions = [];
  if (N(g.rated_speed) && N(m.nominal_speed) > N(g.rated_speed)) cautions.push(`모터 정격속도 ${fmt(m.nominal_speed)} rpm > 감속기 정격입력속도 ${fmt(g.rated_speed)} rpm`);
  if (N(g.max_speed) && N(m.max_speed) > N(g.max_speed)) cautions.push(`모터 최대속도 ${fmt(m.max_speed)} rpm > 감속기 최대입력속도 ${fmt(g.max_speed)} rpm`);
  const load = N(cond.loadTorque);
  if (load && t2 != null && t2 < load) { level = 'bad'; issues.push('부하토크보다 출력 부족'); }
  return { eff, t2, t2peak, need, rated, margin, n2, issues, cautions, level };
}
// 정밀도 값 표기
const withUnit = (v, u) => v == null || v === '' ? null : `${fmt(N(v))} ${u || ''}`.trim();
const backlashOf = (g, grade) => { const v = g[grade] ?? g[grade.toLowerCase()]; return withUnit(v, g.backlash_unit || 'arcmin'); };
const repOf = g => withUnit(g.repeatibility ?? g.repeatability, g.repeatibility_unit ?? g.repeatability_unit);
const posOf = g => withUnit(g.positioning, g.positioning_unit);
function condAllows(x) {
  const c = S.cond;
  if (c.ratioMode === 'all') return true;
  if (c.ratioMode === 'pick') return !c.ratios.length || c.ratios.includes(x.ratio);
  const sp = c.spec;   // 감속기 지정: 시리즈(필수) · 사이즈 · 감속비
  return (!!x.fit || x.unknown) && x.g.series_code === sp.series && (!sp.size || x.sizeLabel === sp.size) && (!sp.ratio || x.ratio === +sp.ratio)
    && (x.kind !== 'hollow' || ((!sp.rep || repOf(x.g) === sp.rep) && (!sp.pos || posOf(x.g) === sp.pos)));
}
function results() {
  if (!S.motor) return [];
  return candidates(S.motor, S.cond.kind).filter(c => c.ratio && condAllows(c)).map(c => ({ ...c, ev: evaluate(c) }));
}

/* ---------- 렌더 ---------- */
const STEP_NAMES = ['', '모터 선택', '모터 확인', '감속기 조건', '감속기 선택', '최종 확인'];
function renderStepper() {
  document.querySelectorAll('#stepper li').forEach(li => {
    const n = +li.dataset.step;
    li.className = n === S.step ? 'cur' : n < S.step ? 'done' : '';
  });
}
function go(n) {
  S.step = n; renderStepper(); render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('#stepper').addEventListener('click', e => {
  const li = e.target.closest('li.done'); if (li) go(+li.dataset.step);
});

function render() {
  const main = $('#main');
  const html = [view1, view2, view3, view4, view5][S.step - 1]();
  main.innerHTML = html;
  [bind1, bind2, bind3, bind4, bind5][S.step - 1]();
}
function navHTML({ prev = true, next = '다음 →', nextDisabled = false, extra = '' } = {}) {

}
function bindNav(onNext) {
  $('#btnPrev')?.addEventListener('click', () => go(S.step - 1));
  $('#btnNext')?.addEventListener('click', onNext || (() => go(S.step + 1)));
}
const iconCheck = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>';

const MOUNTING_TYPE = { B5: '관통 홀(Through Hole)', B14: '탭가공 홀(Threaded Hole)' };
function motorKV(m) {

// 스토리지 파일 주소: 비공개 버킷은 서명 URL, 공개 버킷은 공개 URL
//  download 를 주면 '첨부파일'로 내려오는 주소 (PC·모바일 모두 저장), 없으면 브라우저에서 바로 여는 주소 (PDF 뷰어)
const LINK_TTL = 3600;   // 서명 URL 유효 시간(초)
async function storageUrls(bucketName, paths, download) {
  const bucket = sb.storage.from(bucketName);
  const { data, error } = await bucket.createSignedUrls(paths, LINK_TTL, download ? { download: true } : undefined);
  return paths.map((p, i) => {
    const d = !error && data?.[i];
    if (d && !d.error && d.signedUrl) return d.signedUrl;
    return bucket.getPublicUrl(p, download ? { download: true } : undefined).data.publicUrl;
  });
}
// 파일 내려받기: 첨부파일 주소로 이동 → 브라우저가 저장 (모바일 포함, 화면은 그대로)
async function downloadFromStorage(bucketName, path) {
  const [url] = await storageUrls(bucketName, [path], true);
  const res = await fetch(url, { method: 'HEAD' }).catch(() => null);
  if (res && !res.ok) throw new Error(res.status === 400 || res.status === 404
    ? `${bucketName} 버킷에서 ${path} 파일을 찾지 못했거나 읽기 권한이 없습니다.` : `서버 응답 ${res.status}`);
  const a = document.createElement('a'); a.href = url; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000);
}
// STEP 파일 3D 보기: Online 3D Viewer(3dviewer.net)가 브라우저에서 파일 주소를 직접 읽어 보여 줌
const STEP_VIEWER = url => 'https://3dviewer.net/#model=' + url;

/* PDF 보기: 브라우저에 PDF 뷰어가 있으면(PC Chrome·Edge, iPhone Safari) 새 탭으로 열고,
   없으면(안드로이드 등 → 열면 '다운로드' 창이 뜸) 페이지 안에서 PDF.js 로 그려 보여 줌 */
const HAS_PDF_VIEWER = navigator.pdfViewerEnabled === true;
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLib = null, pdfDoc = null, pdfScale = 1, pdfSeq = 0;
function loadPdfJs() {
  if (pdfLib) return pdfLib;
  pdfLib = new Promise((ok, fail) => {
    const sc = document.createElement('script'); sc.src = PDFJS + 'pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => { pdfLib = null; fail(new Error('PDF 뷰어를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
    document.head.appendChild(sc);
  });
  return pdfLib;
}
async function openPdfViewer(url, name, dlUrl) {
  const seq = ++pdfSeq;
  $('#pdfTitle').textContent = name; $('#pdfDl').href = dlUrl || url;
  $('#pdfBody').innerHTML = '<div class="pdf-msg">PDF를 불러오는 중…</div>';
  $('#pdfModal').hidden = false; document.body.style.overflow = 'hidden';
  try {
    const lib = await loadPdfJs();
    const doc = await lib.getDocument({ url }).promise;
    if (seq !== pdfSeq) return;
    pdfDoc = doc; pdfScale = 1; await drawPdf(seq);
  } catch (e) {
    if (seq !== pdfSeq) return;
    $('#pdfBody').innerHTML = `<div class="pdf-msg">PDF를 표시하지 못했습니다. 다운로드 버튼으로 받아 보세요.<br><small>${esc(errText(e))}</small></div>`;
  }
}
async function drawPdf(seq) {
  const body = $('#pdfBody'), doc = pdfDoc; if (!doc) return;
  const width = Math.max(200, Math.min(body.clientWidth, document.documentElement.clientWidth) - 24);
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  $('#pdfZoom').textContent = Math.round(pdfScale * 100) + '%';
  body.innerHTML = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n);
    if (seq !== pdfSeq) return;
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: (width / base.width) * pdfScale * dpr });
    const cv = document.createElement('canvas');
    cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    cv.style.width = Math.floor(vp.width / dpr) + 'px'; cv.style.height = Math.floor(vp.height / dpr) + 'px';
    body.appendChild(cv);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }
}
function closePdfViewer() { pdfSeq++; pdfDoc?.destroy?.(); pdfDoc = null; $('#pdfModal').hidden = true; $('#pdfBody').innerHTML = ''; document.body.style.overflow = ''; }
$('#pdfClose').addEventListener('click', closePdfViewer);
$('#pdfModal').addEventListener('click', e => { if (e.target.id === 'pdfModal') closePdfViewer(); });

/* ---------- 감속기 종류 안내 사진 (photo 버킷) ---------- */
const PHOTO = { bucket: 'photo', exts: /\.(jpe?g|png|webp|gif|bmp)$/i,
  match: { planetary: /planetary|유성|^gp/i, hollow: /hollow|할로우|rotary|^gs/i } };
let photoIndex = null;   // Promise<{ folders: [{name, files:[{path,name}]}] } | {error}>
function buildPhotoIndex() {
  if (photoIndex) return photoIndex;
  photoIndex = (async () => {
    const bucket = sb.storage.from(PHOTO.bucket);
    const root = await listAll(bucket, '');
    const folders = [];
    const walk = async (prefix, depth) => {
      const files = [];
      for (const o of await listAll(bucket, prefix)) {
        if (o.name === '.emptyFolderPlaceholder') continue;
        const path = `${prefix}/${o.name}`;
        if (o.id == null && !o.metadata) { if (depth < 4) files.push(...await walk(path, depth + 1)); }
        else if (PHOTO.exts.test(o.name)) files.push({ path, name: o.name });
      }
      return files;
    };
    for (const o of root) if (o.id == null && !o.metadata) folders.push({ name: o.name, files: (await walk(o.name, 1)).sort((a, b) => cmpNat(a.name, b.name)) });
    return { folders };
  })().catch(e => { photoIndex = null; return { error: `사진 목록을 읽지 못했습니다 (${PHOTO.bucket} 버킷 읽기 권한을 확인하세요): ${errText(e)}` }; });
  return photoIndex;
}
async function photoUrls(paths) {
  const bucket = sb.storage.from(PHOTO.bucket);
  const map = new Map();
  try {
    const { data, error } = await bucket.createSignedUrls(paths, 3600);
    if (!error) for (const d of data || []) if (d.signedUrl && !d.error) map.set(d.path, d.signedUrl);
  } catch {}
  for (const p of paths) if (!map.has(p)) map.set(p, bucket.getPublicUrl(p).data.publicUrl);
  return map;
}

  // 없으면 파일명·폴더 이름이 시리즈 코드로 시작하는지로 찾음 (예전 방식)

/* 사진 → 시리즈: 파일명(확장자 제외)이 시리즈 코드로 시작하면 그 시리즈 (예: GPB.jpg, GPB_외형.png, GSN85Z.jpg)

let drawingIndex = null;   // Promise<{ files: [{path,name,size}], folders: n } | { error }>
async function listAll(bucket, prefix) {
  const out = [];
  for (let offset = 0; ; offset += 1000) {
    const { data, error } = await bucket.list(prefix, { limit: 1000, offset, sortBy: { column: 'name', order: 'asc' } });
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}
function buildDrawingIndex() {
  if (drawingIndex) return drawingIndex;
  drawingIndex = (async () => {
    const bucket = sb.storage.from(DRAWING.bucket);
    const files = []; let folders = 0;
    const queue = [{ prefix: '', depth: 0 }];
    while (queue.length) {
      const { prefix, depth } = queue.shift();
      const items = await listAll(bucket, prefix);
      for (const o of items) {
        if (o.name === '.emptyFolderPlaceholder') continue;
        const path = prefix ? `${prefix}/${o.name}` : o.name;
        if (o.id == null && !o.metadata) {                 // 폴더
          folders++;
          if (depth < 8 && folders <= 2000) queue.push({ prefix: path, depth: depth + 1 });
        } else files.push({ path, name: o.name, size: o.metadata?.size });
      }
    }
    return { files, folders };
  })().catch(e => { drawingIndex = null; return { error: `도면 목록을 읽지 못했습니다 (${DRAWING.bucket} 버킷 읽기 권한을 확인하세요): ${errText(e)}` }; });
  return drawingIndex;
}
async function findDrawings(key) {
  const idx = await buildDrawingIndex();
  if (idx.error) return idx;
  const order = { pdf: 0, step: 1, stp: 1 };
  const hits = idx.files.map(f => {
    const m = String(f.name).match(/^(.*)\.([^.]+)$/);
    return m && m[1].toUpperCase() === key.toUpperCase() && DRAWING.exts[m[2].toLowerCase()] ? { ...f, ext: m[2].toLowerCase(), folder: f.path.includes('/') ? f.path.slice(0, f.path.lastIndexOf('/')) : '' } : null;
  }).filter(Boolean).sort((a, b) => order[a.ext] - order[b.ext] || a.path.localeCompare(b.path));
  const seen = new Set();
  const uniq = hits.filter(f => { const k = f.name.toUpperCase(); if (seen.has(k)) return false; seen.add(k); return true; });

}

    findDrawings(key).then(files => {
      const box = $('#dFiles'); if (!box || $('#dKey')?.textContent !== key) return;
      if (files.error) { box.innerHTML = `<span style="color:var(--danger)">${esc(files.error)}</span>`; return; }
      if (!files.length) { box.textContent = `${DRAWING.bucket} 스토리지에 ${key}.pdf / .step 파일이 없습니다.`; return; }
      // 보기·다운로드 주소를 미리 만들어 진짜 링크로 둠 (모바일 팝업 차단 방지). 유효 시간이 지나면 클릭할 때 새로 만듦
      const paths = files.map(f => f.path);
      const made = Date.now();
      Promise.all([storageUrls(DRAWING.bucket, paths, false), storageUrls(DRAWING.bucket, paths, true)]).then(([view, dl]) => {
        if ($('#dFiles') !== box) return;
        box.innerHTML = files.map((f, i) => {
          const isPdf = f.ext === 'pdf';
          const viewHref = isPdf ? view[i] : STEP_VIEWER(view[i]);
          return `<div class="dfile">
            <div class="dname"><b>${esc(DRAWING.exts[f.ext])}</b><small>${esc(f.name)}${f.size ? ' · ' + fmtSize(f.size) : ''}</small></div>
            <a class="btn" data-i="${i}" data-act="view" href="${esc(viewHref)}" target="${VIEW_WIN}" rel="opener">${isPdf ? 'PDF 보기' : '3D 보기'}</a>
            <a class="btn primary" data-i="${i}" data-act="dl" href="${esc(dl[i])}" download="${esc(f.name)}" rel="noopener">${iconDoc}다운로드</a>
          </div>`;
        }).join('');
        box.querySelectorAll('a[data-act]').forEach(a => a.addEventListener('click', async e => {
          const f = files[+a.dataset.i], fresh = Date.now() - made < (LINK_TTL - 120) * 1000;
          // 보기 → 별도 창(닫기 누르면 선정툴로 돌아옴). 팝업이 막히면 PDF 는 페이지 안 뷰어, STEP 은 새 탭
          if (a.dataset.act === 'view') {
            e.preventDefault();
            const win = openViewerWindow();   // 클릭 순간에 창을 먼저 열어야 팝업 차단을 피함
            try {
              const [u, d] = fresh ? [view[+a.dataset.i], dl[+a.dataset.i]]
                : await Promise.all([storageUrls(DRAWING.bucket, [f.path], false), storageUrls(DRAWING.bucket, [f.path], true)]).then(x => [x[0][0], x[1][0]]);
              if (win) writeViewer(win, f.ext === 'pdf' ? 'pdf' : 'step', f.name, u, d);
              else if (f.ext === 'pdf') { toast('팝업이 차단되어 이 화면 안에서 엽니다.'); openPdfViewer(u, f.name, d); }
              else { toast('팝업이 차단되었습니다. 브라우저에서 이 사이트의 팝업을 허용해 주세요.', true); }
            } catch (err) { win?.close(); toast(`도면을 열지 못했습니다. ${errText(err)}`, true); }
            return;
          }
          if (fresh) {
            if (a.dataset.act === 'dl') toast(`${f.name} 다운로드를 시작했습니다.`);
            return;
          }
          e.preventDefault();   // 주소가 만료됨 → 새로 만들어 이동
          const w = a.dataset.act === 'view' ? window.open('about:blank', '_blank') : null;
          try {
            const [u] = await storageUrls(DRAWING.bucket, [f.path], a.dataset.act === 'dl');
            const href = a.dataset.act === 'view' ? (f.ext === 'pdf' ? u : STEP_VIEWER(u)) : u;
            if (w) w.location.href = href; else location.href = href;
          } catch (err) { w?.close(); toast(`도면을 열지 못했습니다. ${errText(err)}`, true); }
        }));
      }).catch(e => { box.innerHTML = `<span style="color:var(--danger)">도면 주소를 만들지 못했습니다: ${esc(errText(e))}</span>`; });
    });
  }
  bindNav(() => { S.motor = null; S.pick = null; S.f = { brand: '', type: '', model: '' }; S.cond.ratios = []; S.cond.spec = { series: '', size: '', ratio: '', rep: '', pos: '' }; go(1); });
}

/* ---------- 연결 설정 화면 ---------- */
function openSettings() {
  $('#stepper').hidden = true;
  $('#main').innerHTML = `<section class="card setup">
    <div class="card-head"><div><h2>Supabase 연결</h2><p>Supabase 대시보드의 Connect 버튼(또는 Project Settings → API Keys)에서 두 값을 복사해 넣으세요. 이 컴퓨터의 브라우저에만 저장됩니다.</p></div></div>
    <label class="f"><span>Project URL</span><input type="url" id="sUrl" value="${esc(store.get(CFG_URL) || '')}" placeholder="https://abcdefgh.supabase.co"></label>
    <label class="f"><span>anon / publishable key</span><input type="text" id="sKey" value="${esc(store.get(CFG_KEY) || '')}" placeholder="eyJhbGciOi… 또는 sb_publishable_…"></label>
    <p style="margin:0;font-size:12px;color:var(--muted)">이 페이지는 조회만 합니다. 로그인은 필요 없고, service_role(secret) 키는 넣지 마세요.</p>
    <div class="nav" style="margin:0">${sb ? '<button class="btn" id="sCancel">취소</button>' : ''}<span class="spacer"></span><button class="btn primary lg" id="sSave">연결</button></div>
  </section>`;
  $('#sCancel')?.addEventListener('click', () => { $('#stepper').hidden = false; render(); });
  $('#sSave').addEventListener('click', async () => {
    const url = $('#sUrl').value.trim().replace(/\/+$/, ''), key = $('#sKey').value.trim();
    if (!/^https?:\/\/.+/.test(url) || key.length < 20) { toast('Project URL과 키를 확인하세요.', true); return; }
    if (/sb_secret_/.test(key) || (() => { try { return JSON.parse(atob(key.split('.')[1])).role === 'service_role'; } catch { return false; } })()) { toast('service_role(secret) 키입니다. anon / publishable 키를 넣어 주세요.', true); return; }
    store.set(CFG_URL, url); store.set(CFG_KEY, key);
    await start();
  });
}
$('#btnSettings').addEventListener('click', openSettings);

/* config.js 의 고정 연결 값 (있으면 연결 화면을 건너뜀) */
const FIXED = (() => {
  const c = window.GEARBOX_CONFIG || {};
  const url = String(c.supabaseUrl || '').trim().replace(/\/+$/, ''), key = String(c.supabaseAnonKey || '').trim();
  if (!/^https?:\/\/.+/.test(url) || key.length < 20) return null;
  const secret = /sb_secret_/.test(key) || (() => { try { return JSON.parse(atob(key.split('.')[1])).role === 'service_role'; } catch { return false; } })();
  return secret ? { error: 'config.js 에 service_role(secret) 키가 들어 있습니다. anon / publishable 키로 바꾸세요.' } : { url, key };
})();
if (FIXED) $('#btnSettings').hidden = true;

async function start() {
  if (FIXED?.error) { $('#main').innerHTML = `<section class="card"><div class="callout bad"><div>${esc(FIXED.error)}</div></div></section>`; return; }
  const url = FIXED ? FIXED.url : store.get(CFG_URL), key = FIXED ? FIXED.key : store.get(CFG_KEY);
  if (!window.supabase) { $('#main').innerHTML = '<section class="card"><div class="callout bad"><div>Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.</div></div></section>'; return; }
  if (!url || !key) { openSettings(); return; }
  sb = window.supabase.createClient(url, key, { auth: { persistSession: false } });
  $('#main').innerHTML = '<div class="loading">모터·감속기 데이터를 불러오는 중…</div>';
  try {
    await loadAll();
    $('#connState').hidden = true;   // 연결되면 상단 상태 문구는 표시하지 않음
    $('#stepper').hidden = false; renderStepper(); render();
  } catch (e) {
    $('#connState').className = 'conn'; $('#connState').textContent = '연결 실패'; $('#connState').hidden = false;
    toast(errText(e), true);
    if (FIXED) $('#main').innerHTML = `<section class="card"><div class="callout bad"><div>DB에 연결하지 못했습니다. 잠시 후 새로고침하거나 관리자에게 알려 주세요.<br><small>${esc(errText(e))}</small></div></div></section>`;
    else openSettings();
  }
}
start();
})();
</script>
